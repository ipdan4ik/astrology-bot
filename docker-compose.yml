services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quantuum
      POSTGRES_PASSWORD: quantuum
      POSTGRES_DB: quantuum
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantuum"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migration:
    build: .
    command: uv run alembic upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uv run uvicorn quantuum.api.app:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
    ports:
      - "8000:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  bot-worker:
    build: .
    command: uv run python -m quantuum.bot.runner
    env_file: .env
    environment:
      MASTER_BOT_TOKEN: ${MASTER_BOT_TOKEN:-}
      MASTER_BOT_USERNAME: ${MASTER_BOT_USERNAME:-}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  task-worker:
    build: .
    command: uv run arq quantuum.tasks.worker.WorkerSettings
    env_file: .env
    environment:
      MASTER_BOT_TOKEN: ${MASTER_BOT_TOKEN:-}
      MASTER_BOT_USERNAME: ${MASTER_BOT_USERNAME:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
