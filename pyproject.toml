[project]
name = "quantuum-bot"
version = "0.1.0"
description = "Multi-tenant astrology Telegram bot platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.13",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "aiosmtplib>=3.0",
    "email-validator>=2.0",
    "cryptography>=48.0.0",
    "astronomy-engine>=2.1.19",
    "lunar-python>=1.4.4",
    "tzdata>=2024.1",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantuum"]
